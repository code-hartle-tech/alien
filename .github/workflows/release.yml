name: Release

# Tagging is the trigger. Everything a user can download is built here from the
# tagged commit — no artefact is ever uploaded from a workstation.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.6.0)"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── One reviewed source tarball, vendored, that every package builds from ──
  # Vendoring here rather than per-package means each distro build is offline
  # and reproducible, and the exact bytes users can download are the exact
  # bytes the packages were built from.
  source:
    name: Source tarball
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - id: meta
        run: |
          version=$(awk -F'"' '/^version = / { print $2; exit }' code/Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Alien $version"

      - name: Build vendored source tarball
        run: code/tools/mkrelease.sh --vendor

      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/alien-*.tar.gz*
          if-no-files-found: error

  # ── Native binaries ───────────────────────────────────────────────────────
  binaries:
    name: Linux x86_64 binaries
    runs-on: ubuntu-24.04
    needs: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: code

      - name: Build release binaries
        working-directory: code
        run: cargo build --release --locked --workspace

      - name: Stage
        run: |
          version="${{ needs.source.outputs.version }}"
          mkdir -p out
          for b in alien alien-tui alien-gui alien-daemon alien-cooling; do
            install -Dm755 "code/target/release/$b" "out/$b-$version-linux-x86_64"
          done
          install -Dm644 LICENSE "out/LICENSE-$version.txt"
          install -Dm644 NOTICE  "out/NOTICE-$version.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: out/*
          if-no-files-found: error

  # ── Debian / Ubuntu / Mint ────────────────────────────────────────────────
  # Built in a Debian container with a rustup toolchain rather than the distro
  # compiler: no Debian or Ubuntu release ships rustc 1.88 yet, so the recipe's
  # own Build-Depends is not satisfiable there. `-d` skips that check. The
  # recipe stays honest for the day Debian catches up; the artefact users
  # download is built here.
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    needs: source
    container: debian:trixie
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - name: Build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            build-essential debhelper devscripts dpkg-dev ca-certificates curl \
            pkg-config libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxi-dev libxkbcommon-dev libxrandr-dev

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build .deb
        run: |
          version="${{ needs.source.outputs.version }}"
          tar -xzf "src/alien-$version.tar.gz"
          cd "alien-$version"
          cp -r packaging/debian/debian .
          # -nc (no clean) is load-bearing, not an optimisation. dpkg-buildpackage
          # runs `dh clean` first, and dh_clean deletes `*.orig` as leftover patch
          # artifacts — which silently removes every `Cargo.toml.orig` that
          # `cargo vendor` wrote. The build then dies calculating checksums for
          # files that were there a moment ago. We extract into a fresh directory
          # every run, so there is nothing to clean anyway.
          dpkg-buildpackage -us -uc -b -d -nc
          mkdir -p ../out
          cp ../*.deb ../out/

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: out/*.deb
          if-no-files-found: error

  # ── Fedora / RHEL ─────────────────────────────────────────────────────────
  rpm:
    name: Fedora package
    runs-on: ubuntu-24.04
    needs: source
    container: fedora:42
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - name: Build dependencies
        run: |
          dnf -y install rpm-build rpmdevtools cargo rust pkgconf-pkg-config \
            systemd-rpm-macros mesa-libEGL-devel mesa-libGL-devel \
            wayland-devel libX11-devel libXcursor-devel libXi-devel \
            libxkbcommon-devel libXrandr-devel

      - name: Build .rpm
        run: |
          version="${{ needs.source.outputs.version }}"
          rpmdev-setuptree
          cp "src/alien-$version.tar.gz" "$HOME/rpmbuild/SOURCES/"
          tar -xzf "src/alien-$version.tar.gz"
          rpmbuild -bb "alien-$version/packaging/fedora/alien.spec"
          mkdir -p out
          find "$HOME/rpmbuild/RPMS" -name '*.rpm' -exec cp {} out/ \;

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: out/*.rpm
          if-no-files-found: error

  # ── Arch ──────────────────────────────────────────────────────────────────
  # makepkg refuses to run as root, so the build runs as an unprivileged user.
  arch:
    name: Arch package
    runs-on: ubuntu-24.04
    needs: source
    container: archlinux:base-devel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: source
          path: src

      - name: Build dependencies
        run: |
          pacman -Syu --noconfirm rust pkgconf libglvnd libxkbcommon wayland \
            libx11 libxkbcommon-x11 libxcursor libxi libxrandr git

      - name: Build package
        run: |
          set -eux
          version="${{ needs.source.outputs.version }}"
          useradd -m builder
          mkdir -p /build

          # The recipe travels inside the tarball, so the package is built from
          # exactly the reviewed source that is published, not from a checkout
          # that could differ.
          tar -xzf "src/alien-$version.tar.gz" -C /tmp
          cp "/tmp/alien-$version/packaging/arch/PKGBUILD"     /build/
          cp "/tmp/alien-$version/packaging/arch/alien.install" /build/
          cp "src/alien-$version.tar.gz"                        /build/

          # Single source of truth for the version is Cargo.toml; rewrite rather
          # than trust the recipe to have been bumped in step.
          sed -i "s/^pkgver=.*/pkgver=$version/" /build/PKGBUILD

          chown -R builder:builder /build
          # --nodeps: the runtime deps are already installed above, and
          # acpi_call-dkms is not installable in a container.
          su builder -c "cd /build && makepkg --noconfirm --nodeps -f"

          mkdir -p out
          cp /build/*.pkg.tar.zst out/

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: out/*.pkg.tar.zst
          if-no-files-found: error

  # ── Container image ───────────────────────────────────────────────────────
  docker:
    name: Container image
    runs-on: ubuntu-24.04
    needs: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        env:
          # Without this the action uploads a `.dockerbuild` build record as a
          # workflow artifact. The publish job downloads every artifact, and
          # that one consistently fails to extract, taking the whole release
          # down with it.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.source.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Sandboxed frontends ───────────────────────────────────────────────────
  # Non-blocking on purpose: these two toolchains break in CI far more often
  # than the native packages, and a Flatpak hiccup must not hold up a release
  # that is otherwise complete. The release job reports anything missing rather
  # than quietly shipping a short set.
  flatpak:
    name: Flatpak bundle
    runs-on: ubuntu-24.04
    needs: source
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build bundle
        run: |
          version="${{ needs.source.outputs.version }}"
          sudo flatpak install --noninteractive flathub \
            org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08 \
            org.freedesktop.Sdk.Extension.rust-stable//23.08
          flatpak-builder --repo=repo --force-clean build \
            packaging/flatpak/tech.hartle.Alien.yml
          mkdir -p out
          flatpak build-bundle repo \
            "out/tech.hartle.Alien-$version-x86_64.flatpak" tech.hartle.Alien

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: out/*.flatpak
          if-no-files-found: warn

  snap:
    name: Snap package
    runs-on: ubuntu-24.04
    needs: source
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Stage snapcraft.yaml
        run: |
          mkdir -p snap
          cp packaging/snap/snapcraft.yaml snap/

      - uses: snapcore/action-build@v1
        id: build

      - name: Stage output
        run: |
          mkdir -p out
          cp "${{ steps.build.outputs.snap }}" out/

      - uses: actions/upload-artifact@v4
        with:
          name: snap
          path: out/*.snap
          if-no-files-found: warn

  # ── Publish ───────────────────────────────────────────────────────────────
  release:
    name: Publish release
    runs-on: ubuntu-24.04
    needs: [source, binaries, deb, rpm, arch, docker, flatpak, snap]
    if: always() && needs.source.result == 'success' && needs.binaries.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: staged
          # Named explicitly rather than "everything": anything else that any
          # action decides to upload is not a release asset, and pulling it in
          # blindly is how a green build produced a failed release.
          pattern: "{source,binaries,deb,rpm,arch,flatpak,snap}"
          merge-multiple: true

      - name: Assemble and checksum
        id: assemble
        run: |
          version="${{ needs.source.outputs.version }}"
          mkdir -p dist
          find staged -type f -exec cp {} dist/ \;

          # The installer is the one deliberately un-versioned asset: the
          # one-line command resolves through /releases/latest/download/, which
          # can only match a fixed filename.
          install -Dm755 packaging/install.sh dist/alien-install.sh

          cd dist
          sha256sum ./* > "SHA256SUMS-$version"
          echo "--- published assets ---"
          ls -la

          # Name what is missing rather than shipping a short set silently.
          missing=""
          ls ./*.deb           >/dev/null 2>&1 || missing="$missing deb"
          ls ./*.rpm           >/dev/null 2>&1 || missing="$missing rpm"
          ls ./*.pkg.tar.zst   >/dev/null 2>&1 || missing="$missing arch"
          ls ./*.flatpak       >/dev/null 2>&1 || missing="$missing flatpak"
          ls ./*.snap          >/dev/null 2>&1 || missing="$missing snap"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          [ -z "$missing" ] || echo "::warning::packages not built:$missing"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-rc') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            ## Install in one line

            ```sh
            curl -fsSL https://alien.hartle.tech/install.sh | sh
            ```

            Detects your distribution, installs the matching package below,
            sets up the service and tells you the one manual step left.

            ## Or take a package

            | | |
            |---|---|
            | Debian · Ubuntu · Mint | `sudo apt install ./alien_*_amd64.deb` |
            | Fedora | `sudo dnf install ./alien-*.x86_64.rpm` |
            | Arch · Manjaro | `sudo pacman -U ./alien-*-x86_64.pkg.tar.zst` |
            | Container | `ghcr.io/${{ github.repository }}:${{ needs.source.outputs.version }}` |

            Verify what you downloaded:

            ```sh
            sha256sum -c SHA256SUMS-${{ needs.source.outputs.version }}
            ```

            Packages not built for this release:${{ steps.assemble.outputs.missing || ' none' }}

            ---

            **Not sure your laptop is supported?** Run `alien doctor` — it only
            reads — and open a
            [hardware support request](https://github.com/${{ github.repository }}/issues/new?template=hardware-support.yml).
