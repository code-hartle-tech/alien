[package]
name = "alien-core"
description = "Acer Predator gaming WMI protocol: fans, RGB, turbo, telemetry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
serde.workspace = true
toml.workspace = true

# Windows-only, and target-gated so the Linux surface keeps its two-dependency
# budget. The `wmi` crate wraps the COM/WBEM plumbing this would otherwise need
# several hundred lines of unsafe to reproduce, and it handles the VARIANT
# marshalling rule that a hand-rolled port gets wrong — CIM uint64 must cross as
# a string, not an integer.
[target.'cfg(windows)'.dependencies]
wmi = "0.18"
